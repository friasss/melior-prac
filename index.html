<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Melior — Bienes Raíces</title>

    <!-- Preconnect for hero image and icons only -->
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Material Symbols (icons only) — async, non-blocking -->
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=optional"
      onload="this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=optional" />
    </noscript>

    <!-- Prevent icon text flash: hide until font loads or 800ms timeout -->
    <style>
      .material-symbols-outlined { opacity: 0; transition: opacity 0.15s; }
      .fonts-loaded .material-symbols-outlined { opacity: 1; }
    </style>
    <script>
      (function() {
        function markLoaded() { document.documentElement.classList.add('fonts-loaded'); }
        // Show icons once Material Symbols is ready, or after 800ms max
        var t = setTimeout(markLoaded, 800);
        document.fonts.load('1em "Material Symbols Outlined"').then(function() {
          clearTimeout(t); markLoaded();
        }).catch(markLoaded);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
